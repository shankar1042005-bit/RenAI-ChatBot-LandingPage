<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Login | RenAI ChatBot</title>
  <link rel="icon" type="image/png" href="assets/renai-bird.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
  <!-- Only used if this file is opened on its own (fallback). Inside final.html the page already loads these. -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="login.css">
</head>
<body data-login-standalone>
<!-- MEMBER LOGIN SHEET
     final.html loads this file (via login.js) and uses the <dialog> below as the login sheet. -->
<dialog id="memberLoginSheet" class="login-sheet">

  <div class="login-wrapper">

    <div class="login-card">

      <button type="button" class="login-close" id="closeLoginSheet" aria-label="Close login">&times;</button>

      <h2>MEMBER LOGIN</h2>

      <form id="memberLoginForm">

        <!-- USERNAME -->
        <div class="login-input">

          <svg viewBox="0 0 24 24">
            <path d="M12 12a5 5 0 1 0 0-10
            5 5 0 0 0 0 10zm0 2
            c-5 0-9 2.5-9 6v2h18v-2
            c0-3.5-4-6-9-6z"/>
          </svg>

          <input
            type="text"
            id="loginUsername"
            placeholder="Username"
            autocomplete="username"
            required>

        </div>

        <!-- PASSWORD -->
        <div class="login-input">

          <svg viewBox="0 0 24 24">
            <path d="M17 8h-1V6a4 4 0
            0 0-8 0v2H7a3 3 0
            0 0-3 3v9a3 3 0
            0 0 0 3h10a3 3 0
            0 0 0 3V11a3 3
            0 0 0-3-3zM10 6a2 2
            0 0 1 4 0v2h-4zm3
            10.7V19h-2v-2.3a2
            2 0 1 1 2 0z"/>
          </svg>

          <input
            type="password"
            id="loginPassword"
            placeholder="*********"
            autocomplete="current-password"
            required>

        </div>

        <!-- LOGIN BUTTON -->
        <button type="submit" class="login-submit">
          LOGIN
        </button>

        <!-- REMEMBER & FORGOT -->
        <div class="login-options">

          <label class="remember-option">
            <input type="checkbox" id="rememberLogin">
            <span>Remember me</span>
          </label>

          <a href="#" class="forgot-password" id="forgotPassword">
            Forgot Password?
          </a>

        </div>

        <p id="loginMessage" class="login-message"
           role="status"></p>

      </form>

      <!-- SOCIAL BUTTONS -->
      <div class="login-social">

        <button type="button" class="social-btn social-blue">
          SOCIAL
        </button>

        <button type="button" class="social-btn social-cyan">
          NETWORK
        </button>

        <button type="button" class="social-btn social-red">
          LINKS
        </button>

      </div>

    </div>

    <!-- COPYRIGHT -->
    <p class="login-copyright">
      Copyright © 2026 RenAI Global, Inc
    </p>

  </div>

</dialog>

<script src="login.js"></script>
</body>
</html>
